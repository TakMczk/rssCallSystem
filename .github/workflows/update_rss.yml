name: Update Curated RSS

on:
  schedule:
    - cron: '0 22 * * *'  # JST 07:00
  workflow_dispatch:

# Grant GITHUB_TOKEN the necessary permissions
permissions:
  contents: write    # Allows git push to the repository
  pages: write       # Allows GitHub Pages deployment
  id-token: write    # Allows GitHub Pages deployment auth

concurrency:
  group: curated-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
          SITE_BASE_URL: https://takmczk.github.io/rssCallSystem/
          USE_OPENAI: 'true'
          PYTHONPATH: .
        run: |
          python -m src.main
      - name: Commit & Push RSS
        id: commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add docs/
          if git diff --cached --quiet; then 
            echo 'No changes to commit'; 
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else 
            git commit -m 'chore: update rss and pages'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Pages
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.changed == 'true' }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before Pages deploy retry 2
        if: ${{ steps.deployment_1.outcome == 'failure' }}
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_2
        if: ${{ steps.deployment_1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before Pages deploy retry 3
        if: ${{ steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' }}
        run: sleep 60
      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_3
        if: ${{ steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Fail if Pages deploy retries were exhausted
        if: ${{ steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' && steps.deployment_3.outcome == 'failure' }}
        run: |
          echo 'GitHub Pages deployment failed after 3 attempts.'
          exit 1
